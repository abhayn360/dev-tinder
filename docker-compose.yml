# Runs the API + a local MongoDB with one command: docker compose up --build
services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/devtinder
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
